<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ShadowLab banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101214"/><stop offset="1" stop-color="#1d2430"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6f432"/><stop offset="1" stop-color="#7be495"/></linearGradient>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"><animate attributeName="stdDeviation" values="6;20;6" dur="4s" repeatCount="indefinite"/></feGaussianBlur>
      <feOffset in="b" dy="14" result="o"><animate attributeName="dy" values="6;28;6" dur="4s" repeatCount="indefinite"/></feOffset>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="90" y="40" width="240" height="240" rx="22" fill="#e9edf2"/>
  <g filter="url(#sh)">
    <rect x="145" y="92" width="130" height="120" rx="18" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -10;0 4" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="390" y="150" font-size="76" font-weight="700" fill="url(#ac)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">ShadowLab</text>
  <text x="392" y="200" font-size="28" fill="#d5dce8" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Layered shadows without the guesswork.</text>
  <text x="392" y="245" font-size="20" fill="#7b8798" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">Sliders  •  Layers  •  Presets  •  One-click copy</text>
</svg>
